[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raguard"
version = "1.0.0"
description = "RAGuard SDK - RAG System Security Protection"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "RAGuard Team", email = "support@raguard.com"}
]
keywords = ["rag", "security", "llm", "ai", "prompt-injection", "jailbreak"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.28.0",
    "aiohttp>=3.9.0",
    "cryptography>=40.0.0",
]

[project.optional-dependencies]
pdf = [
    "pdfplumber>=0.9.0",
]
docx = [
    "python-docx>=0.8.11",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/JasonD2019/raguard-sdk"
Repository = "https://github.com/JasonD2019/raguard-sdk"
Documentation = "https://github.com/JasonD2019/raguard-sdk#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["raguard*", "core*", "license*", "utils*", "rules*"]
exclude = ["tests*", "detectors*"]

[tool.setuptools.package-data]
raguard = ["rules/*.json", "rules/**/*.json"]